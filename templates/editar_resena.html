{% extends "base.html" %}

{% block titulo %}Editar reseña - Mi biblioteca{% endblock %}

{% block contenido %}
    <h1>✏️ Editar reseña</h1>
    <h2 style="margin-top: 0.5rem; font-weight: normal;">{{ libro.titulo }}</h2>
    <p><em>{{ libro.autor }}</em></p>

    <form method="POST" action="{{ url_for('editar_resena', libro_id=libro.id) }}"
          style="margin-top: 2rem; display: inline-block; width: 100%; max-width: 600px;">
        <textarea name="resena" rows="8"
                  placeholder="Escribe tu reseña, impresiones, frases favoritas..."
                  style="width: 100%; padding: 15px; border-radius: 10px; border: none; font-family: inherit;
                         font-size: 1em; resize: vertical;">{{ libro.resena }}</textarea>

        <div style="margin-top: 1rem; display: flex; gap: 10px; justify-content: center;">
            <button type="submit"
                    style="background: #48bb78; color: white; border: none; border-radius: 8px;
                           padding: 10px 24px; cursor: pointer; font-weight: bold;">
                💾 Guardar
            </button>
            <a href="{{ url_for('inicio') }}"
               style="background: rgba(255,255,255,0.2); color: white; text-decoration: none;
                      border-radius: 8px; padding: 10px 24px; font-weight: bold;">
                Cancelar
            </a>
        </div>
    </form>
{% endblock %}
